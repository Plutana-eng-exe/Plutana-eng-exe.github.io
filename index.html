<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Generator</title>
</head>
<body>
    <script>
        function generateKey() {
            let digits = '';
            for (let i = 0; i < 8; i++) {
                digits += Math.floor(Math.random() * 10);
            }
            return 'Plutana-' + digits;
        }
        document.write(generateKey());
    </script>
</body>
</html>
