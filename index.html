<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plutana Key Manager</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #0b0e14;
      color: #e0e6ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1a1f2a;
      border-radius: 20px;
      padding: 30px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #2d3545;
    }
    h1 {
      font-weight: 500;
      font-size: 1.8rem;
      margin-top: 0;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
      color: #f0f4ff;
    }
    .sub {
      color: #8892a5;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    button {
      background: #2d3748;
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      flex: 1 1 auto;
      min-width: 120px;
      border: 1px solid #3f4a5e;
    }
    button:hover {
      background: #3f4a60;
      border-color: #5a6a82;
    }
    button.primary {
      background: #4f7cf7;
      border-color: #4f7cf7;
    }
    button.primary:hover {
      background: #6a8ffb;
      border-color: #6a8ffb;
    }
    input {
      background: #10151e;
      border: 1px solid #2d3545;
      color: #e0e6ed;
      padding: 12px 16px;
      border-radius: 40px;
      font-size: 1rem;
      width: 100%;
      outline: none;
      transition: 0.2s;
      margin-bottom: 12px;
    }
    input:focus {
      border-color: #4f7cf7;
    }
    .key-display {
      background: #0f141e;
      border-radius: 14px;
      padding: 20px;
      margin: 20px 0;
      border-left: 4px solid #4f7cf7;
    }
    .key-display .key {
      font-family: 'Courier New', monospace;
      font-size: 1.3rem;
      font-weight: 600;
      color: #b7c9ff;
      word-break: break-all;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 20px;
      margin-top: 14px;
      font-size: 0.9rem;
    }
    .info-grid .label {
      color: #8892a5;
    }
    .info-grid .value {
      color: #d0d9e8;
      font-weight: 500;
      text-align: right;
    }
    .countdown {
      font-size: 1.6rem;
      font-weight: 600;
      color: #8cf0a0;
      text-align: center;
      padding: 12px 0 0;
      letter-spacing: 1px;
    }
    .countdown.warning {
      color: #f5b86c;
    }
    .countdown.danger {
      color: #f56c6c;
    }
    .error {
      color: #f56c6c;
      background: #2a1a1a;
      padding: 10px 16px;
      border-radius: 40px;
      margin: 12px 0;
      font-size: 0.9rem;
      border: 1px solid #5a2a2a;
      display: none;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #5a6a82;
      text-align: center;
      border-top: 1px solid #2d3545;
      padding-top: 18px;
    }
    .footer a {
      color: #6a8ffb;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Plutana Keys</h1>
    <div class="sub">Generate and track keys with 24h expiry</div>

    <div class="btn-group">
      <button class="primary" id="generateBtn">New Key</button>
      <button id="checkBtn">Check Key</button>
    </div>

    <input type="text" id="keyInput" placeholder="Enter a key (e.g. Plutana-123e4567-e89b-12d3-a456-426614174000)" value="" />

    <div id="errorBox" class="error"></div>

    <div id="keyDisplay" class="key-display" style="display: none;">
      <div class="key" id="keyValue"></div>
      <div class="info-grid">
        <span class="label">Usage</span>
        <span class="value" id="usageValue">0</span>
        <span class="label">Created</span>
        <span class="value" id="createdValue">—</span>
        <span class="label">Expires</span>
        <span class="value" id="expiresValue">—</span>
      </div>
      <div class="countdown" id="countdownDisplay">--:--:--</div>
    </div>

    <div class="footer">
      Powered by <a href="#" target="_blank">Plutana Worker</a>
    </div>
  </div>

  <script>
    // Point this to your deployed Cloudflare Worker
    const WORKER_URL = 'https://spring-forest-1d9c.teegandunlap123.workers.dev';

    const keyInput = document.getElementById('keyInput');
    const generateBtn = document.getElementById('generateBtn');
    const checkBtn = document.getElementById('checkBtn');
    const keyDisplay = document.getElementById('keyDisplay');
    const keyValue = document.getElementById('keyValue');
    const usageValue = document.getElementById('usageValue');
    const createdValue = document.getElementById('createdValue');
    const expiresValue = document.getElementById('expiresValue');
    const countdownDisplay = document.getElementById('countdownDisplay');
    const errorBox = document.getElementById('errorBox');

    let countdownInterval = null;
    let currentExpiry = null;

    async function callWorker(key = null) {
      const url = key ? `${WORKER_URL}?key=${encodeURIComponent(key)}` : WORKER_URL;
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    function displayKeyData(data) {
      keyDisplay.style.display = 'block';
      keyValue.textContent = data.key;
      usageValue.textContent = data.usage;
      createdValue.textContent = new Date(data.created).toLocaleString();
      expiresValue.textContent = new Date(data.expiresAt).toLocaleString();
      currentExpiry = new Date(data.expiresAt).getTime();
      startCountdown(currentExpiry);
    }

    function startCountdown(expiryMs) {
      if (countdownInterval) clearInterval(countdownInterval);

      function update() {
        const now = Date.now();
        let diff = Math.max(0, expiryMs - now);
        const hours = Math.floor(diff / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);

        const pad = (n) => String(n).padStart(2, '0');
        countdownDisplay.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

        countdownDisplay.className = 'countdown';
        if (diff < 3600000) {
          countdownDisplay.classList.add('danger');
        } else if (diff < 7200000) {
          countdownDisplay.classList.add('warning');
        }

        if (diff === 0) {
          clearInterval(countdownInterval);
          keyDisplay.style.display = 'none';
          showError('This key has expired.');
        }
      }

      update();
      countdownInterval = setInterval(update, 1000);
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      setTimeout(() => { errorBox.style.display = 'none'; }, 5000);
    }

    function clearError() {
      errorBox.style.display = 'none';
    }

    async function generateKey() {
      clearError();
      try {
        const data = await callWorker();
        keyInput.value = data.key;
        displayKeyData(data);
      } catch (err) {
        showError(err.message);
      }
    }

    async function checkKey() {
      const key = keyInput.value.trim();
      if (!key) {
        showError('Please enter a key first.');
        return;
      }
      clearError();
      try {
        const data = await callWorker(key);
        displayKeyData(data);
      } catch (err) {
        showError(err.message);
        keyDisplay.style.display = 'none';
        if (countdownInterval) clearInterval(countdownInterval);
      }
    }

    generateBtn.addEventListener('click', generateKey);
    checkBtn.addEventListener('click', checkKey);
    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkKey();
    });
  </script>
</body>
</html>
